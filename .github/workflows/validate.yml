name: validate
on:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python tools/public_release.py --tracked
      - name: Install pinned official 7-Zip for real codec tests
        run: python tools/ci_7zip.py
      - name: Install optional decoding and timezone test dependencies
        run: python -m pip install "zstandard>=0.23,<1" "tzdata>=2025.2"
      - run: python -m unittest discover -s tests -v
      - name: Exercise real ZIP/LZMA export backend
        shell: pwsh
        run: |
          python tools/smoke_external.py --archiver "$env:AGY_EXPORT_TEST_7Z"
          if ($LASTEXITCODE -ne 0) { throw 'Real LZMA integration failed.' }
      - name: Parse/import PowerShell and run regressions using selected interpreter
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./Test-AntigravityExporter.ps1 -PythonPath (Get-Command python).Source
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python tools/public_release.py --tracked
      - run: python -m pip install 'build>=1.2,<2' 'twine>=6,<7'
      - run: python -m build
      - run: python tools/public_release.py --build
      - run: python -m twine check dist/*.whl dist/*.tar.gz
      - run: python -m pip install dist/*.whl
      - name: Installed package diagnostics and listings outside checkout
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/tools/smoke_installed.py"
