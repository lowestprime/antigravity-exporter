name: validate
on:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python tools/public_release.py --tracked
      - run: python -m unittest discover -s tests -v
      - name: Parse/import PowerShell and run regressions using selected interpreter
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./Test-AntigravityExporter.ps1 -PythonPath (Get-Command python).Source
      - name: Exercise real Windows ZIP/LZMA backend
        if: runner.os == 'Windows' && matrix.python == '3.13'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archiver = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path -LiteralPath $archiver)) {
            $archiver = (Get-Command 7z -CommandType Application -ErrorAction Stop).Source
          }
          python tools/smoke_external.py --archiver $archiver
          if ($LASTEXITCODE -ne 0) { throw 'Real Windows LZMA integration failed.' }
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python tools/public_release.py --tracked
      - run: python -m pip install 'build>=1.2,<2' 'twine>=6,<7'
      - run: python -m build
      - run: python tools/public_release.py --build
      - run: python -m twine check dist/*.whl dist/*.tar.gz
      - run: python -m pip install dist/*.whl
      - name: Installed package works outside checkout
        run: cd "$RUNNER_TEMP" && antigravity-export --version
