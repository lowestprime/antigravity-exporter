name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Validate immutable tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from antigravity_exporter import __version__
          if os.environ['RELEASE_TAG'] != 'v'+__version__:
              raise SystemExit('Tag/package version mismatch')
          PY
      - run: python tools/public_release.py --tracked
      - run: python -m pip install 'build>=1.2,<2' 'twine>=6,<7'
      - run: python -m build
      - run: python tools/public_release.py --build
      - run: python -m twine check dist/*.whl dist/*.tar.gz
      - name: Publish checked distributions (RC tags remain prereleases)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          args=(--verify-tag --title "Antigravity Exporter ${RELEASE_TAG#v}" --notes-file CHANGELOG.md)
          if [[ "$RELEASE_TAG" == *rc* ]]; then args+=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" dist/* "${args[@]}"
