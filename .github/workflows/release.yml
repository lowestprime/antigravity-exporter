name: release
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - antigravity_exporter/__init__.py
      - pyproject.toml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-publication
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/validate.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python tools/public_release.py --tracked
      - run: python -m pip install 'build>=1.2,<2' 'twine>=6,<7'
      - run: python -m build
      - run: python tools/public_release.py --build
      - run: python -m twine check dist/*.whl dist/*.tar.gz
      - name: Publish checked distributions without replacing existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python tools/publish_github_release.py
